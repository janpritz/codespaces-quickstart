
version: "3.1"
stories:
- story: interactive_story_1
  steps:
  - user: |-
      hi i am fritz
    commands:
    - flow: greet_flow
      command: start flow
    - name: username
      value: Fritz
      extractor: LLM
      command: set slot
  - intent: inform_username
    entities:
    - name: fritz
  - action: utter_ask_student_question
  - user: |-
      need assistance with enrollment
    commands:
    - flow: enrollment_flow
      command: start flow
  - intent: inquire_enrollment
    entities:
    - name: enrollment
  - action: flow_enrollment_flow
  - stack:
    - op: add
      path: /0
      value:
        frame_id: QQ6EJ3TT
        flow_id: enrollment_flow
        step_id: START
        frame_type: regular
        type: flow
  - action: utter_ask_enrollment_category
  - user: |-
      enrollment_category=schedule)
    commands:
    - name: enrollment_category
      value: schedule
      extractor: LLM
      command: set slot
  - action: utter_enrollment_schedule
  - action: utter_ask_did_that_help
  - user: |-
      Yes
    commands:
    - name: feedback
      value: 'True'
      extractor: LLM
      command: set slot
  - action: action_run_slot_rejections
  - action: utter_happy_response
  - action: flow_pattern_completed
  - stack:
    - op: add
      path: /1
      value:
        frame_id: 1030HUAA
        flow_id: pattern_completed
        step_id: START
        frame_type: interrupt
        type: flow
