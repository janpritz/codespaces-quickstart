flows:
  error_handler:
    description: Handles repeated system errors. After three errors, ends the conversation and starts a new session.
    steps:
      - action: increment_error_count
        next:
          - if: slots.error_count >= 3
            then: restart_conversation_message
          - else: END

      - id: restart_conversation_message
        action: utter_restart_conversation
        next: END
      