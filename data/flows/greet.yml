flows:
  greet_user_flow:
    description: Greets the user and asks how to assist them further.
    nlu_trigger:
      - intent: greet
    steps:
      - action: utter_greet
      - action: utter_help_user
  
  inform_username:
    description: This flow is triggered when the user provides their username.
    nlu_trigger:
      - intent: inform_username
    steps:
      - action: utter_greet
        next: END